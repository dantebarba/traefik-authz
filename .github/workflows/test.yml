name: test

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: sh -n scripts/scan-secrets.sh && sh -n .githooks/pre-push
      - run: sh scripts/scan-secrets.sh
      - run: docker build -t traefik-authz:ci .
